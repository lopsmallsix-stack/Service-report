
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Service Report</title>

<style>
:root {
  --navy:#17365d;
  --blue:#245a91;
  --bg:#f2f5f9;
  --line:#d6dee8;
  --text:#182230;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Thai",sans-serif;
  font-size:15px;
}
header {
  background:var(--navy);
  color:white;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #0002;
}
header h1 { margin:0 0 5px; font-size:21px; }
header p { margin:0; font-size:12px; opacity:.85; }
main {
  max-width:1000px;
  margin:auto;
  padding:12px;
}
.panel {
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin-bottom:13px;
}
h2 { font-size:17px; margin:0 0 12px; color:var(--navy); }
h3 { font-size:15px; margin:0 0 10px; }
label {
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}
input,textarea,select,button {
  font:inherit;
}
input[type=text],input[type=date],input[type=email],
textarea,select {
  width:100%;
  min-height:44px;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:var(--text);
}
textarea { resize:vertical; min-height:75px; }
.field { margin-bottom:12px; min-width:0; }
.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:0 12px;
}
button {
  border:0;
  border-radius:9px;
  min-height:43px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}
button:active { opacity:.75; }
.primary { background:var(--navy); color:white; }
.secondary { background:#e6edf5; color:var(--navy); }
.danger { background:#fee2e2; color:#991b1b; }
.success { background:#dcfce7; color:#166534; }
.button-row {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.button-row button { flex:1 1 130px; }
.step {
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  background:#fff;
  break-inside:avoid;
}
.step-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.step-number {
  font-weight:bold;
  color:var(--navy);
  font-size:16px;
}
.photo-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:8px;
}
.photo-item {
  min-width:0;
  border:1px solid var(--line);
  border-radius:8px;
  padding:5px;
}
.photo-item img {
  display:block;
  width:100%;
  height:115px;
  object-fit:contain;
  background:#f1f5f9;
}
.photo-item button {
  width:100%;
  margin-top:5px;
  min-height:34px;
}
.photo-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0.01;
  overflow: hidden;
  pointer-events: none;
}

.button-row button {
  min-height: 46px;
  touch-action: manipulation;
}
.photo-label {
  display:block;
  text-align:center;
  background:#e6edf5;
  color:var(--navy);
  padding:12px 8px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.small-note { font-size:12px; color:#64748b; margin-top:6px; }
.preset-row {
  display:flex;
  gap:6px;
  margin-top:6px;
}
.preset-row select { flex:1; min-width:0; }
.preset-row button { flex:0 0 auto; }
hr { border:0; border-top:1px solid var(--line); margin:15px 0; }
#status { font-size:13px; margin:8px 0; color:#166534; }
#pdfArea { background:white; }
.report-title { text-align:center; font-size:20px; font-weight:bold; }
.report-subtitle { text-align:center; font-size:12px; margin:4px 0 14px; }
.no-print {}
@media(min-width:650px) {
  main { padding:20px; }
  .grid { grid-template-columns:1fr 1fr; }
  .photo-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media print {
  body { background:white; }
  header,.no-print,button,.photo-label { display:none !important; }
  main { max-width:none; padding:0; }
  .panel,.step { border:1px solid #aaa; border-radius:0; }
}
</style>
</head>

<body>
<header class="no-print">
  <h1>Service Report</h1>
  <p>Mobile-friendly · Save draft · Export PDF</p>
</header>

<main>
  <section class="panel no-print">
    <h2>ข้อมูลรายงาน</h2>
    <div class="grid">
      <div class="field">
        <label for="reportNo">Report No.</label>
        <input id="reportNo" type="text" placeholder="เช่น SR-2026-001">
      </div>
      <div class="field">
        <label for="reportDate">Date</label>
        <input id="reportDate" type="date">
      </div>
      <div class="field">
        <label for="customer">Customer</label>
        <input id="customer" type="text" placeholder="ชื่อลูกค้า">
      </div>
      <div class="field">
        <label for="machine">Machine / Model</label>
        <input id="machine" type="text" placeholder="รุ่นเครื่องจักร">
      </div>
      <div class="field">
        <label for="serial">Serial No.</label>
        <input id="serial" type="text" placeholder="Serial number">
      </div>
      <div class="field">
        <label for="engineer">Service Engineer</label>
        <input id="engineer" type="text" placeholder="ชื่อผู้ปฏิบัติงาน">
      </div>
    </div>
    <div class="field">
      <label for="problem">Customer Complaint / Problem</label>
      <textarea id="problem" placeholder="รายละเอียดปัญหาที่ได้รับแจ้ง"></textarea>
    </div>
  </section>

  <section class="panel no-print">
    <h2>เครื่องมือจัดการรายงาน</h2>
    <div class="button-row">
      <button class="primary" onclick="addStep()">＋ เพิ่ม Step</button>
      <button class="secondary" onclick="saveDraft()">บันทึกร่าง</button>
      <button class="secondary" onclick="loadDraft()">โหลดร่าง</button>
      <button class="success" onclick="exportPDF()">สร้าง PDF</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="small-note">
      ร่างจะถูกบันทึกไว้ในเบราว์เซอร์ของอุปกรณ์นี้
      ควรดาวน์โหลด PDF หรือสำรองข้อมูลเป็นระยะ
    </p>
  </section>

  <section id="stepsPanel" class="panel">
    <h2>Service Steps</h2>
    <div id="steps"></div>
    <button class="primary no-print" style="width:100%" onclick="addStep()">
      ＋ เพิ่ม Step
    </button>
  </section>

  <section class="panel no-print">
    <h2>ประโยคสำเร็จรูป</h2>
    <p class="small-note">เพิ่มข้อความที่ใช้บ่อย เพื่อเลือกใส่ในแต่ละ Step ได้รวดเร็ว</p>
    <div class="field">
      <label for="presetCategory">ประเภทข้อความ</label>
      <select id="presetCategory">
        <option value="target">Target</option>
        <option value="action">Action</option>
        <option value="result">Result</option>
        <option value="next">Next Action</option>
      </select>
    </div>
    <div class="field">
      <label for="presetText">ข้อความ</label>
      <textarea id="presetText" placeholder="พิมพ์ประโยคสำเร็จรูป"></textarea>
    </div>
    <button class="primary" style="width:100%" onclick="addPreset()">เพิ่มประโยค</button>
    <hr>
    <div id="presetManager"></div>
    <hr>
    <div class="button-row">
      <button class="secondary" onclick="exportPresets()">สำรองประโยค</button>
      <button class="secondary" onclick="document.getElementById('presetFile').click()">นำเข้าประโยค</button>
      <input id="presetFile" class="photo-input" type="file" accept=".json,application/json" onchange="importPresets(event)">
    </div>
  </section>
</main>

<!-- พื้นที่สร้าง PDF -->
<div id="pdfArea" style="position:fixed;left:0;top:0;width:1040px;background:white;padding:0;z-index:-1;pointer-events:none;">
  <div id="pdfContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
"use strict";

const DB_NAME = "ServiceReportMobileDB";
const STORE_NAME = "drafts";
const DRAFT_KEY = "current";
const PRESET_KEY = "serviceReportMobilePresets";

const defaultPresets = {
  target: [
    "Inspect the machine and identify the root cause.",
    "Check the machine operation and error condition."
  ],
  action: [
    "Inspected the machine and checked the error history.",
    "Checked the electrical connections and related components.",
    "Replaced the defective component and performed a functional test."
  ],
  result: [
    "Machine operation returned to normal.",
    "The issue could not be reproduced during testing.",
    "Further investigation is required."
  ],
  next: [
    "Monitor the machine operation.",
    "Follow up with the customer.",
    "Prepare a quotation for the required spare parts."
  ]
};

let presets = loadPresetsFromLocal();
let stepCounter = 0;

function setStatus(message, error = false) {
  const el = document.getElementById("status");
  el.textContent = message;
  el.style.color = error ? "#b91c1c" : "#166534";
}

function loadPresetsFromLocal() {
  try {
    const saved = localStorage.getItem(PRESET_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      return {
        target: Array.isArray(parsed.target) ? parsed.target : [...defaultPresets.target],
        action: Array.isArray(parsed.action) ? parsed.action : [...defaultPresets.action],
        result: Array.isArray(parsed.result) ? parsed.result : [...defaultPresets.result],
        next: Array.isArray(parsed.next) ? parsed.next : [...defaultPresets.next]
      };
    }
  } catch (e) {
    console.warn("Could not read presets", e);
  }
  return JSON.parse(JSON.stringify(defaultPresets));
}

function savePresetsToLocal() {
  try {
    localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
    renderPresetManager();
  } catch (e) {
    setStatus("บันทึกประโยคไม่สำเร็จ พื้นที่เก็บข้อมูลอาจเต็ม", true);
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function addPreset() {
  const category = document.getElementById("presetCategory").value;
  const text = document.getElementById("presetText").value.trim();
  if (!text) {
    setStatus("กรุณากรอกข้อความก่อน", true);
    return;
  }
  presets[category].push(text);
  document.getElementById("presetText").value = "";
  savePresetsToLocal();
  setStatus("เพิ่มประโยคสำเร็จ");
}

function deletePreset(category, index) {
  if (!confirm("ต้องการลบประโยคนี้หรือไม่?")) return;
  presets[category].splice(index, 1);
  savePresetsToLocal();
  setStatus("ลบประโยคแล้ว");
}

function renderPresetManager() {
  const labels = {
    target:"Target",
    action:"Action",
    result:"Result",
    next:"Next Action"
  };
  const root = document.getElementById("presetManager");
  root.innerHTML = Object.keys(labels).map(category => `
    <h3>${labels[category]}</h3>
    ${presets[category].map((phrase, i) => `
      <div class="preset-row">
        <div style="flex:1;min-width:0;padding:10px 0;overflow-wrap:anywhere">
          ${escapeHTML(phrase)}
        </div>
        <button class="danger" onclick="deletePreset('${category}',${i})" aria-label="ลบประโยค">ลบ</button>
      </div>
    `).join("") || '<p class="small-note">ยังไม่มีประโยค</p>'}
  `).join("");
}

function exportPresets() {
  downloadBlob(
    new Blob([JSON.stringify(presets, null, 2)], {type:"application/json"}),
    "service-report-presets.json"
  );
}

async function importPresets(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    for (const key of ["target","action","result","next"]) {
      if (!Array.isArray(data[key]) || !data[key].every(x => typeof x === "string")) {
        throw new Error("รูปแบบไฟล์ไม่ถูกต้อง");
      }
    }
    presets = data;
    savePresetsToLocal();
    setStatus("นำเข้าประโยคสำเร็จ");
  } catch (e) {
    setStatus("อ่านไฟล์ไม่ได้: " + e.message, true);
  }
  event.target.value = "";
}

function addStep(data = {}) {
  stepCounter++;
  const id = "step_" + Date.now() + "_" + stepCounter;
  const wrapper = document.createElement("div");
  wrapper.className = "step";
  wrapper.dataset.stepId = id;

  wrapper.innerHTML = `
    <div class="step-head">
      <span class="step-number">Step ${document.querySelectorAll("#steps .step").length + 1}</span>
      <button type="button" class="danger no-print" onclick="removeStep(this)">ลบ Step</button>
    </div>

    ${makeTextField("Target", "target", data.target || "", id)}
    ${makeTextField("Action", "action", data.action || "", id)}

    <div class="field">
  <label>Photo(s)</label>

  <div class="button-row no-print">
    <button type="button" class="secondary"
      onclick="this.closest('.field').querySelector('.album-input').click()">
      🖼️ เลือกรูปจากอัลบั้ม
    </button>

    <button type="button" class="secondary"
      onclick="this.closest('.field').querySelector('.camera-input').click()">
      📷 ถ่ายรูปใหม่
    </button>
  </div>

  <input class="photo-input album-input"
    type="file" accept="image/*" multiple
    onchange="handlePhotos(this)">

  <input class="photo-input camera-input"
    type="file" accept="image/*" capture="environment"
    onchange="handlePhotos(this)">

  <div class="photo-grid"></div>
  <p class="small-note no-print">เลือกรูปได้หลายรูปจากอัลบั้ม หรือถ่ายรูปใหม่ได้</p>
</div>

    ${makeTextField("Result", "result", data.result || "", id)}
    ${makeTextField("Next Action", "next", data.next || "", id)}
  `;

  document.getElementById("steps").appendChild(wrapper);

  const photoGrid = wrapper.querySelector(".photo-grid");
  (Array.isArray(data.photos) ? data.photos : []).forEach(src => {
    addPhotoToGrid(photoGrid, src);
  });

  updateStepNumbers();
}

function makeTextField(label, category, value, id) {
  const fieldId = id + "_" + category;
  return `
    <div class="field">
      <label for="${fieldId}">${label}</label>
      <textarea id="${fieldId}" data-field="${category}" placeholder="${label}...">${escapeHTML(value)}</textarea>
      <div class="preset-row no-print">
        <select aria-label="เลือกประโยคสำเร็จรูป" onchange="applyPreset(this,'${fieldId}')">
          <option value="">เลือกประโยคสำเร็จรูป...</option>
          ${presets[category].map((p,i) => `<option value="${i}">${escapeHTML(p)}</option>`).join("")}
        </select>
        <button type="button" class="secondary" onclick="clearPresetSelect(this)">ล้าง</button>
      </div>
    </div>
  `;
}

function applyPreset(select, fieldId) {
  if (select.value === "") return;
  const category = document.getElementById(fieldId).dataset.field;
  const phrase = presets[category][Number(select.value)];
  if (phrase === undefined) return;

  const field = document.getElementById(fieldId);
  field.value = field.value.trim()
    ? field.value.trim() + "\n" + phrase
    : phrase;
  select.value = "";
}

function clearPresetSelect(button) {
  const select = button.parentElement.querySelector("select");
  select.value = "";
}

function removeStep(button) {
  if (!confirm("ต้องการลบ Step นี้หรือไม่?")) return;
  button.closest(".step").remove();
  updateStepNumbers();
}

function updateStepNumbers() {
  document.querySelectorAll("#steps .step").forEach((step, i) => {
    step.querySelector(".step-number").textContent = "Step " + (i + 1);
  });
}

function addPhotoToGrid(grid, src) {
  const item = document.createElement("div");
  item.className = "photo-item";
  item.innerHTML = `
    <img alt="Service photo">
    <button type="button" class="danger no-print" onclick="this.closest('.photo-item').remove()">ลบรูป</button>
  `;
  item.querySelector("img").src = src;
  grid.appendChild(item);
}

async function handlePhotos(input) {
  const files = Array.from(input.files || []);
  const grid = input.closest(".field").querySelector(".photo-grid");

  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;
    try {
      const compressed = await compressImage(file);
      addPhotoToGrid(grid, compressed);
    } catch (e) {
      setStatus("อ่านรูปไม่สำเร็จ: " + file.name, true);
    }
  }
  input.value = "";
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const maxSide = 1400;
        const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * ratio));
        canvas.height = Math.max(1, Math.round(img.height * ratio));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function getReportData() {
  const get = id => document.getElementById(id).value;
  const steps = Array.from(document.querySelectorAll("#steps .step")).map(step => ({
    target: step.querySelector('[data-field="target"]').value,
    action: step.querySelector('[data-field="action"]').value,
    photos: Array.from(step.querySelectorAll(".photo-item img")).map(img => img.src),
    result: step.querySelector('[data-field="result"]').value,
    next: step.querySelector('[data-field="next"]').value
  }));

  return {
    reportNo:get("reportNo"),
    reportDate:get("reportDate"),
    customer:get("customer"),
    machine:get("machine"),
    serial:get("serial"),
    engineer:get("engineer"),
    problem:get("problem"),
    steps
  };
}

function setReportData(data) {
  const fields = ["reportNo","reportDate","customer","machine","serial","engineer","problem"];
  fields.forEach(key => {
    document.getElementById(key).value = data[key] || "";
  });

  document.getElementById("steps").innerHTML = "";
  stepCounter = 0;
  (Array.isArray(data.steps) ? data.steps : []).forEach(addStep);
  if (!data.steps || !data.steps.length) addStep();
}

function openDB() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("เบราว์เซอร์นี้ไม่รองรับ IndexedDB"));
      return;
    }
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveDraft() {
  try {
    const db = await openDB();
    const data = getReportData();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(data, DRAFT_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });

    db.close();
    setStatus("บันทึกร่างในอุปกรณ์นี้แล้ว ✓");
  } catch (e) {
    console.error(e);
    setStatus("บันทึกไม่สำเร็จ พื้นที่อาจเต็ม กรุณาลดจำนวนหรือขนาดรูป", true);
  }
}

async function loadDraft() {
  try {
    const db = await openDB();
    const data = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(DRAFT_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    db.close();

    if (!data) {
      setStatus("ยังไม่มีร่างที่บันทึกไว้", true);
      return;
    }
    setReportData(data);
    setStatus("โหลดร่างแล้ว ✓");
  } catch (e) {
    console.error(e);
    setStatus("โหลดร่างไม่สำเร็จ", true);
  }
}

function buildPDFHTML(data) {
  const esc = escapeHTML;
  const stepsHTML = data.steps.map((s, i) => `
    <tr>
      <td class="step-cell">${i + 1}</td>
      <td>${esc(s.target).replace(/\n/g,"<br>")}</td>
      <td>${esc(s.action).replace(/\n/g,"<br>")}</td>
      <td>
        <div class="photos">
          ${(s.photos || []).map(src => `<img src="${src}" alt="Service photo">`).join("")}
        </div>
      </td>
      <td>${esc(s.result).replace(/\n/g,"<br>")}</td>
      <td>${esc(s.next).replace(/\n/g,"<br>")}</td>

async function exportPDF() {
  if (typeof html2pdf === "undefined") {
    setStatus("โหลดเครื่องมือ PDF ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่", true);
    return;
  }

  const data = getReportData();
  const content = document.getElementById("pdfContent");
  const area = document.getElementById("pdfArea");
  content.innerHTML = buildPDFHTML(data);

  setStatus("กำลังสร้าง PDF กรุณารอสักครู่...");

  const safeCustomer = (data.customer || "Customer")
  .trim()
  .replace(/[\\/:*?"<>|]/g, "-")
  .replace(/\s+/g, "_");

const safeDate = (data.reportDate || "No-Date")
  .replace(/[\\/:*?"<>|]/g, "-");

const fileName = `${safeCustomer}_${safeDate}.pdf`;

  const options = {
  margin: [5, 5, 5, 5],
  filename: fileName,
  image: { type: "jpeg", quality: 0.85 },

  html2canvas: {
    scale: 1.3,
    useCORS: true,
    backgroundColor: "#ffffff",
    logging: false,
    scrollX: 0,
    scrollY: 0,
    windowWidth: 1040
  },

  jsPDF: {
    unit: "mm",
    format: "a4",
    orientation: "landscape",
    compress: true
  },

  pagebreak: {
    mode: ["css", "legacy"],
    avoid: ["tr"]
  }
};
  try {
    const worker = html2pdf().set(options).from(content);
    const pdfBlob = await worker.outputPdf("blob");
    const file = new File([pdfBlob], fileName, {type:"application/pdf"});

    // บน iPhone/Android ที่รองรับ จะแสดงเมนูแชร์ไฟล์
    if (navigator.share && navigator.canShare) {
      try {
        if (navigator.canShare({files:[file]})) {
          await navigator.share({
            files:[file],
            title:"Service Report",
            text:"Service Report PDF"
          });
          setStatus("สร้าง PDF แล้ว ✓");
          return;
        }
      } catch (shareError) {
        if (shareError.name === "AbortError") {
          setStatus("สร้าง PDF แล้ว แต่ยกเลิกการแชร์");
          return;
        }
        console.warn("Share unavailable, falling back to download", shareError);
      }
    }

    // สำรองสำหรับเบราว์เซอร์ที่ไม่มี Web Share API
    downloadBlob(pdfBlob, fileName);
    setStatus("สร้าง PDF แล้ว ✓ หากไม่พบไฟล์ ให้ตรวจสอบรายการดาวน์โหลด");
  } catch (e) {
    console.error(e);
    setStatus("สร้าง PDF ไม่สำเร็จ กรุณาลองใหม่ หรือลดจำนวนรูปในรายงาน", true);
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

document.getElementById("reportDate").value =
  new Date().toLocaleDateString("en-CA");

renderPresetManager();
addStep();
</script>
